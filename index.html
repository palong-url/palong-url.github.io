<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Header</title>
  <style>
    /* Container Utama Foto Profil & Ornamen */
    .profile-container {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      /* Sesuaikan margin-top jika foto ingin sedikit melompati/menumpuk banner atas */
      margin-top: 20px; 
      z-index: 10;
    }

    /* Styling Foto Profil Ringkasan */
    .profile-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #b3261e; /* Warna garis merah lingkar foto */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      background-color: #ffffff;
    }

    /* Styling Ornamen / Divider Emas */
    .profile-divider {
      width: 220px; /* Lebar bentangan ornamen */
      height: auto;
      margin-top: -22px; /* Menarik ornamen ke atas agar bulatan tengahnya pas di bawah foto */
      pointer-events: none; /* Supaya tidak mengganggu klik di sekitarnya */
    }
  </style>
</head>
<body>

  <!-- Komponen Foto & Ornamen -->
  <div class="profile-container">
    <img src="foto-kamu.jpg" alt="Foto Profil" class="profile-avatar" />
    <img src="image-removebg-preview.png" alt="Ornamen Emas" class="profile-divider" />
  </div>

</body>
</html>
