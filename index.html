<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhammad Naufal Rahim, CPLD — Legal Drafter & AI Enthusiast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --paper:#FAF6EE;
      --paper-deep:#F1EADA;
      --ink:#211D1A;
      --ink-soft:#4A433C;
      --oxblood:#6B2331;
      --oxblood-deep:#4F1A24;
      --brass:#9A7B34;
      --line:#D8CCB4;
      --slate:#3E4A52;
    }

    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:'IBM Plex Sans', sans-serif;
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto;}
      *{animation:none !important; transition:none !important;}
    }

    h1,h2,h3{
      font-family:'Fraunces', serif;
      font-weight:500;
      color:var(--ink);
      margin:0;
    }

    a{color:inherit;}

    .wrap{
      max-width:920px;
      margin:0 auto;
      padding:0 32px;
    }

    /* Header */
    header.masthead{
      border-bottom:2px solid var(--ink);
      padding:20px 0;
      position:sticky;
      top:0;
      background:var(--paper);
      z-index:50;
    }

    .masthead-inner{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      flex-wrap:wrap;
      gap:12px;
    }

    .masthead-name{
      font-family:'Fraunces', serif;
      font-size:1.15rem;
      letter-spacing:0.01em;
    }

    nav.masthead-nav{
      display:flex;
      gap:28px;
      font-size:0.92rem;
    }

    nav.masthead-nav a{
      text-decoration:none;
      border-bottom:1px solid transparent;
      padding-bottom:2px;
      transition:border-color 0.2s ease;
    }

    nav.masthead-nav a:hover{ border-color:var(--oxblood); }

    /* Banner & Hero */
    .hero-banner-wrap {
      width: 100%;
      background-color: #030825;
      border-bottom: 2px solid var(--ink);
      text-align: center;
      overflow: hidden;
    }

    .hero-banner {
      width: 100%;
      max-width: 920px;
      height: auto;
      max-height: 280px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .hero{
      padding:24px 0 72px;
      border-bottom:1px solid var(--line);
    }

    .hero-avatar{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid var(--paper);
      box-shadow:0 4px 14px rgba(0,0,0,0.15);
      margin-top: -70px;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
      background: var(--paper);
    }

    .hero .docket{
      font-family:'IBM Plex Mono', monospace;
      font-size:0.78rem;
      color:var(--oxblood);
      margin-bottom:20px;
      letter-spacing:0.02em;
    }

    .hero h1{
      font-size:clamp(2.2rem, 4.8vw, 3.4rem);
      line-height:1.12;
      max-width:18ch;
    }

    .hero .role{
      margin-top:18px;
      font-size:1.15rem;
      color:var(--ink-soft);
      max-width:52ch;
    }

    .hero .role strong{
      color:var(--oxblood-deep);
      font-weight:600;
    }

    .hero-actions{
      margin-top:34px;
      display:flex;
      gap:16px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:10px 20px;
      font-size:0.88rem;
      text-decoration:none;
      border:1.5px solid var(--ink);
      font-weight:500;
      transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      cursor:pointer;
    }

    .btn-solid{
      background:var(--oxblood);
      border-color:var(--oxblood);
      color:var(--paper);
    }

    .btn-solid:hover{ background:var(--oxblood-deep); border-color:var(--oxblood-deep); }
    .btn-outline:hover{ background:var(--ink); color:var(--paper); }
